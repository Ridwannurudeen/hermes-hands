name: hermes-hands
label: Hermes Hands
kind: backend
version: "0.1.0"
author: Ridwan Nurudeen
homepage: https://github.com/Ridwannurudeen/hermes-hands
description: >
  Your own laptop as Hermes's hands. Hermes stays on your server; the terminal and file tools, and
  a screenshot you consented to, run on a laptop you paired (native Windows with Git Bash, or Linux;
  no Hermes on the laptop). The laptop dials out over HTTPS and never listens; both ends sign with
  Ed25519 keys pinned at pairing; Hermes approvals stay on; an offline, revoked or unreachable device
  fails closed. Select it with terminal.backend: hands.
requires_hermes: ">=0.23.0"
python_dependencies: []
provides_tools: [hands_screenshot, hands_devices]
provides_hooks: []
requires_env: []
config_schema:
  HANDS_RELAY_SEED: {type: secret, env: HANDS_RELAY_SEED, description: "Relay signing seed. Written once by hermes hands setup."}
  default_target: {type: str, default: server, description: "Target for conversations that have not chosen one. server = this machine, as before."}
  dashboard_url: {type: str, default: "http://127.0.0.1:9119", description: "Loopback address of the dashboard that hosts the relay."}
  owner_ids: {type: list, default: [], description: "platform:user_id entries allowed to pair, revoke and switch targets from a chat. hermes hands setup fills this. Empty: the platform's allow_admin_from list for that chat scope, else local surfaces only."}
  offline_after_seconds: {type: int, default: 20}
  inline_output_limit_bytes: {type: int, default: 1048576}
